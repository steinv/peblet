<div class="divide-y divide-slate-400">
  @for (project of projects; track project) {
    <peblet-portfolio-list-item
      [routerLink]="['/', 'portfolio', project.name]"
      [image]="project.image"
      [name]="project.name"
      [technology]="project.technology">
    </peblet-portfolio-list-item>
  }

</div>
