<ng-container *transloco="let $">
    <div
        *ngIf="navigationService.tabsOpen$ | async"
        class="absolute inset-0 z-10 flex flex-col rounded-3xl bg-slate-200/95 dark:bg-slate-900/95 backdrop-blur-sm text-black dark:text-white"
        (click)="navigationService.closeTabs()"
    >
        <div class="flex justify-end p-2">
            <button
                type="button"
                class="px-2 text-sm underline disabled:opacity-40 disabled:no-underline"
                [disabled]="previews.length === 0"
                (click)="$event.stopPropagation(); clearAll()"
            >{{ $('clearAll') }}</button>
        </div>

        <div class="flex-1 overflow-x-auto overflow-y-hidden flex flex-row items-center snap-x snap-mandatory px-6 py-4">
            <div
                *ngFor="let preview of previews; let i = index"
                class="relative flex w-48 shrink-0 flex-col snap-start"
                [style.marginLeft.px]="i === 0 ? 0 : -110"
                [style.zIndex]="i"
                [style.transform]="'scale(' + scaleFor(i, previews.length) + ')'"
            >
                <div class="mb-2 flex h-6 shrink-0 items-center gap-2 px-1">
                    <fa-icon [icon]="preview.icon" [style.color]="preview.bgColor"></fa-icon>
                    <span class="text-sm font-medium">{{ $(preview.name) }}</span>
                </div>
                <button
                    type="button"
                    class="relative aspect-[9/16] w-full overflow-hidden rounded-3xl border-2 border-slate-300 shadow-xl dark:border-slate-600"
                    (click)="$event.stopPropagation(); open(preview.url)"
                >
                    <div class="pointer-events-none absolute inset-0 bg-white dark:bg-slate-900">
                        <ng-container
                            *ngComponentOutlet="componentFor(preview); injector: injectorFor(preview)"
                        ></ng-container>
                    </div>
                </button>
            </div>

            <p *ngIf="previews.length === 0" class="m-auto text-sm">{{ $('noRecentApps') }}</p>
        </div>
    </div>
</ng-container>
